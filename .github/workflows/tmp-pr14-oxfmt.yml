name: Temporary Oxfmt runner for PR 14

on:
  push:
    branches:
      - khwarizmi/blocksuite-integration-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install repository toolchain
        uses: ./.github/actions/setup-node
        with:
          corepack-install: 'true'
          package-install: 'true'
          electron-install: 'false'

      - name: Format the BlockSuite contract document
        run: yarn oxfmt --write docs/architecture/BLOCKSUITE-INTEGRATION-CONTRACT.md

      - name: Verify formatter output
        run: |
          yarn oxfmt --check docs/architecture/BLOCKSUITE-INTEGRATION-CONTRACT.md
          git diff --check

      - name: Commit formatting-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/BLOCKSUITE-INTEGRATION-CONTRACT.md
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format BlockSuite integration contract with Oxfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
