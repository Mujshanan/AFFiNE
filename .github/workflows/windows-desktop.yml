name: Windows Desktop Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - '.github/actions/setup-node/**'
      - '.github/actions/build-rust/**'
      - 'blocksuite/**'
      - 'packages/common/nbstore/**'
      - 'packages/frontend/core/**'
      - 'packages/frontend/native/**'
      - 'packages/frontend/apps/electron/**'
      - 'packages/frontend/apps/electron-renderer/**'
      - 'package.json'
      - 'yarn.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 desktop
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILD_TYPE: canary
      DISTRIBUTION: desktop
      SKIP_WEB_BUILD: '1'
      HOIST_NODE_MODULES: '1'
      NODE_OPTIONS: --max-old-space-size=14384
      DEBUG: affine:*,napi:*
      APP_NAME: affine
      DEV_DRIVE: ${{ runner.temp }}
      DEV_DRIVE_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Set application version
        uses: ./.github/actions/setup-version
        with:
          app-version: '0.27.5'

      - name: Setup Node.js and Yarn workspaces
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/electron @affine/monorepo @affine/nbstore @toeverything/infra
          hard-link-nm: false
          nmHoistingLimits: workspaces
          enableScripts: true

      - name: Build Windows native modules
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-pc-windows-msvc
          package: '@affine/native'

      - name: Generate desktop assets
        run: yarn affine @affine/electron generate-assets

      - name: Build desktop layers
        run: yarn affine @affine/electron build

      - name: Remove nested workspace modules before packaging
        shell: bash
        run: |
          rm -rf packages/frontend/apps/electron/node_modules/@affine/nbstore/node_modules/@blocksuite/affine/node_modules
          rm -rf packages/frontend/apps/electron/node_modules/@affine/native/node_modules

      - name: Build Windows ZIP and Squirrel packages
        run: yarn affine @affine/electron make --platform=win32 --arch=x64

      - name: Build Windows NSIS installer
        run: yarn affine @affine/electron make-nsis

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khwarizmi-windows-x64
          path: packages/frontend/apps/electron/out/canary/make/**
          if-no-files-found: error
          retention-days: 14
