name: Temporary Oxfmt runner for PR 10

on:
  push:
    branches:
      - khwarizmi/document-evaluation-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install repository toolchain
        uses: ./.github/actions/setup-node
        with:
          corepack-install: 'true'
          package-install: 'true'
          electron-install: 'false'

      - name: Format only the CI-reported files
        run: |
          yarn oxfmt --write \
            docs/architecture/PHASE-B-EVALUATION.md \
            packages/common/khwarizmi-contracts/src/document-evaluator-control-flow.spec.ts \
            packages/common/khwarizmi-contracts/src/document-evaluator-runtime.ts \
            packages/common/khwarizmi-contracts/src/document-evaluator-units.spec.ts \
            packages/common/khwarizmi-contracts/src/document-integrity.spec.ts \
            packages/common/khwarizmi-contracts/src/document-integrity.ts \
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.spec.ts \
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.ts \
            packages/common/khwarizmi-contracts/src/unit-evaluator.ts

      - name: Verify formatter output
        run: |
          yarn oxfmt --check \
            docs/architecture/PHASE-B-EVALUATION.md \
            packages/common/khwarizmi-contracts/src/document-evaluator-control-flow.spec.ts \
            packages/common/khwarizmi-contracts/src/document-evaluator-runtime.ts \
            packages/common/khwarizmi-contracts/src/document-evaluator-units.spec.ts \
            packages/common/khwarizmi-contracts/src/document-integrity.spec.ts \
            packages/common/khwarizmi-contracts/src/document-integrity.ts \
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.spec.ts \
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.ts \
            packages/common/khwarizmi-contracts/src/unit-evaluator.ts
          git diff --check

      - name: Upload exact formatted files
        uses: actions/upload-artifact@v4
        with:
          name: pr10-oxfmt-output
          path: |
            docs/architecture/PHASE-B-EVALUATION.md
            packages/common/khwarizmi-contracts/src/document-evaluator-control-flow.spec.ts
            packages/common/khwarizmi-contracts/src/document-evaluator-runtime.ts
            packages/common/khwarizmi-contracts/src/document-evaluator-units.spec.ts
            packages/common/khwarizmi-contracts/src/document-integrity.spec.ts
            packages/common/khwarizmi-contracts/src/document-integrity.ts
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.spec.ts
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.ts
            packages/common/khwarizmi-contracts/src/unit-evaluator.ts

      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/architecture/PHASE-B-EVALUATION.md \
            packages/common/khwarizmi-contracts/src/document-evaluator-control-flow.spec.ts \
            packages/common/khwarizmi-contracts/src/document-evaluator-runtime.ts \
            packages/common/khwarizmi-contracts/src/document-evaluator-units.spec.ts \
            packages/common/khwarizmi-contracts/src/document-integrity.spec.ts \
            packages/common/khwarizmi-contracts/src/document-integrity.ts \
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.spec.ts \
            packages/common/khwarizmi-contracts/src/rpc-dispatcher.ts \
            packages/common/khwarizmi-contracts/src/unit-evaluator.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: apply pinned Oxfmt to PR 10 files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
