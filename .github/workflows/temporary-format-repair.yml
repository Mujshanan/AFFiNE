name: Temporary formatter repair

on:
  push:
    branches:
      - khwarizmi/contract-validators

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/khwarizmi/contract-validators'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format repository
        run: npx --yes oxfmt@0.63.0 --write .
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format contract and source assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
